<svg
  width="160"
  height="180"
  viewBox="0 0 160 180"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- sombra -->
  <ellipse
    cx="80"
    cy="166"
    rx="34"
    ry="7"
    fill="#000"
    opacity=".35"
  />

  <!-- pernas -->
  <rect
    x="58"
    y="120"
    width="16"
    height="38"
    rx="7"
    fill="#18181B"
  />

  <rect
    x="86"
    y="120"
    width="16"
    height="38"
    rx="7"
    fill="#18181B"
  />

  <!-- botas -->
  <rect
    x="49"
    y="148"
    width="28"
    height="13"
    rx="6"
    fill="#09090B"
  />

  <rect
    x="83"
    y="148"
    width="28"
    height="13"
    rx="6"
    fill="#09090B"
  />

  <!-- capa -->
  <path
    d="M48 77
       Q80 59 112 77
       L121 137
       Q80 151 39 137
       Z"
    fill="#101014"
    stroke="#22D3EE"
    stroke-width="3"
  />

  <!-- corpo -->
  <rect
    x="52"
    y="72"
    width="56"
    height="62"
    rx="20"
    fill="#27272A"
  />

  <!-- faixa mágica -->
  <path
    d="M54 106 L106 91"
    stroke="#22D3EE"
    stroke-width="7"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- braços -->
  <rect
    x="35"
    y="80"
    width="18"
    height="54"
    rx="9"
    transform="rotate(10 35 80)"
    fill="#27272A"
  />

  <rect
    x="107"
    y="80"
    width="18"
    height="54"
    rx="9"
    transform="rotate(-10 107 80)"
    fill="#27272A"
  />

  <!-- pescoço -->
  <rect
    x="70"
    y="59"
    width="20"
    height="19"
    rx="7"
    fill="#D6A47B"
  />

  <!-- cabeça -->
  <circle
    cx="80"
    cy="45"
    r="28"
    fill="#D6A47B"
  />

  <!-- cabelo -->
  <path
    d="M53 47
       Q49 18 75 15
       Q102 10 110 38
       L101 32
       L97 45
       L89 30
       L80 44
       L70 29
       L62 45
       Z"
    fill="#111827"
  />

  <!-- olhos -->
  <rect
    x="64"
    y="47"
    width="9"
    height="4"
    rx="2"
    fill="#0E7490"
  />

  <rect
    x="87"
    y="47"
    width="9"
    height="4"
    rx="2"
    fill="#0E7490"
  />

  <!-- aura -->
  <path
    d="M35 120
       Q19 93 33 71"
    stroke="#22D3EE"
    stroke-width="3"
    stroke-linecap="round"
    opacity=".55"
    filter="url(#glow)"
  />

  <path
    d="M125 120
       Q141 93 127 71"
    stroke="#22D3EE"
    stroke-width="3"
    stroke-linecap="round"
    opacity=".55"
    filter="url(#glow)"
  />
</svg>
